<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff8b78" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="app-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>우리 가족 할 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="quick-add.css" />
    <link rel="stylesheet" href="calendar-items.css" />
    <link rel="stylesheet" href="todo-delete.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sidebar">
        <div class="brand"><span class="brand-mark">✓</span><div><h1>우리 집 할 일</h1><p>오늘도 가볍게, 함께</p></div></div>
        <nav class="family-nav" aria-label="가족 선택">
          <p class="nav-label">FAMILY</p>
          <button class="member active" data-member="재준"><span class="avatar jae">재</span><span>재준</span><b class="count">0</b></button>
          <button class="member" data-member="세인"><span class="avatar sei">세</span><span>세인</span><b class="count">0</b></button>
          <button class="member" data-member="엄마"><span class="avatar mom">엄</span><span>엄마</span><b class="count">0</b></button>
          <button class="member" data-member="아빠"><span class="avatar dad">아</span><span>아빠</span><b class="count">0</b></button>
        </nav>
        <div class="sidebar-tip"><span>✦</span><p>작은 체크 하나가<br />기분 좋은 하루를 만들어요.</p></div>
      </section>

      <section class="content">
        <header class="topbar">
          <div class="today-copy"><p id="dateLabel">2026년 9월 9일 수요일</p><h2><span id="memberName">재준</span>의 할 일</h2></div>
        </header>

        <div class="toolbar">
          <div class="view-tabs" role="tablist"><button class="tab active" data-view="day">일</button><button class="tab" data-view="week">주</button><button class="tab" data-view="month">월</button></div>
          <div class="date-nav"><button id="prevDate" aria-label="이전">‹</button><button class="date-picker" id="todayButton">오늘</button><button id="nextDate" aria-label="다음">›</button></div>
        </div>

        <section id="calendar" class="calendar"></section>
        <section class="todo-section"><div class="section-heading"><h3 id="todoHeading">오늘의 할 일</h3><span id="todoSummary">0개 남음</span></div><form class="quick-add" id="quickAddForm"><span class="quick-add-icon">＋</span><input id="quickTodoText" placeholder="할 일을 바로 입력하세요" autocomplete="off" maxlength="70" required /><button type="submit">추가</button></form><div id="todoList" class="todo-list"></div></section>
      </section>
    </main>

    <script src="app.js"></script>
    <script src="calendar-items.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
  </body>
</html>
